name: PR checks

# The full test suite, on every pull request into main that changes more than Markdown. Merges
# don't re-run it (see main.yml), so keep "Require branches to be up to date before merging" on
# in the branch protection.
on:
  pull_request:
    branches: [main]

# A new push to a PR cancels the run of its previous push.
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # No debug info: faster links and smaller caches. cache.yml sets the same, so its caches match.
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  # Whether the PR changes anything besides Markdown. A docs-only PR skips the builds below; a
  # skipped job counts as passed for the required checks, which a workflow filtered out with
  # paths-ignore would never report, leaving the PR unmergeable.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if git diff --name-only "$BASE" HEAD | grep -qv '\.md$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Only Markdown changed; skipping the builds."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  # Formatting and clippy first, on a cheap Linux runner: a PR that fails them stops here instead
  # of spending Windows and macOS minutes. Linux clippy covers the macOS code (both are unix, and
  # the platform branches are cfg!() expressions, which compile everywhere); Windows runs clippy
  # again for its few #[cfg(windows)] lines.
  lint:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Installs the toolchain pinned in rust-toolchain.toml, with clippy and rustfmt.
      - run: rustup toolchain install
      - run: cargo fmt --all -- --check
      # Shares its cache with cache.yml, which saves one from main after every merge, so a new
      # PR starts warm.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: lint
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  # Two jobs, not one matrix job: a skipped matrix job reports its name unexpanded, so the
  # required windows-latest and macos-latest checks would never arrive. They wait for lint, and
  # fail at once if it failed: a job skipped because a need failed would count as passed.
  # !cancelled(), not always(), so a cancelled run (a newer push) doesn't keep them going.
  windows:
    name: windows-latest
    needs: [changes, lint]
    if: ${{ !cancelled() && needs.changes.outputs.code == 'true' }}
    runs-on: windows-latest
    steps:
      - name: Lint passed
        if: needs.lint.result != 'success'
        run: exit 1
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      # The backup scripts for Windows Server can't run here; at least make sure they parse.
      - name: Parse the PowerShell scripts
        shell: pwsh
        run: |
          $failed = $false
          foreach ($f in Get-ChildItem ops/backup/*.ps1) {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errors)
            if ($errors) { $failed = $true; $errors | ForEach-Object { "$($f.Name): $_" } }
          }
          if ($failed) { exit 1 }

  macos:
    name: macos-latest
    needs: [changes, lint]
    if: ${{ !cancelled() && needs.changes.outputs.code == 'true' }}
    runs-on: macos-latest
    steps:
      - name: Lint passed
        if: needs.lint.result != 'success'
        run: exit 1
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: check
      - run: cargo test --workspace --locked

  # Service containers only run on Linux runners, so database tests live here.
  database:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: hydra
          POSTGRES_DB: hydra
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:hydra@localhost:5432/hydra
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: database
      - run: cargo test -p hydra-db -p hydra-mcp -- --ignored
      # The app's database-worker test runs against a migrated database holding the fixtures.
      - run: cargo run -p hydra-db --bin hydra-admin -- migrate
      - run: cargo run -p hydra-db --bin hydra-admin -- import fixtures/catalogue.json
      # The account test signs in as an engineer, which needs the grants.
      - run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f ops/roles.sql
      - run: cargo test -p hydra -- --ignored
      # Attach the demo models, then smoke-test every stored model.
      - run: cargo run -p hydra-db --bin hydra-admin -- model block blk-demo@1 fixtures/models/demo-block.glb --source fixtures/models/demo-block.step
      - run: cargo run -p hydra-db --bin hydra-admin -- model block blk-demo@2 fixtures/models/demo-block.glb --source fixtures/models/demo-block.step
      - run: cargo run -p hydra-db --bin hydra-admin -- model valve vt-rpe3-06-z11@1 fixtures/models/demo-valve-cetop3.glb --align none
      - run: cargo run -p hydra-db --bin hydra-admin -- model valve vt-demo-4-2@1 fixtures/models/demo-valve-cetop3.glb --align none
      - run: cargo run -p hydra-db --bin hydra-admin -- model valve vt-demo-cartridge-relief@1 fixtures/models/demo-cartridge.glb --source fixtures/models/demo-cartridge.step
      - run: cargo run -p hydra-db --bin hydra-admin -- models
      # Backup, then prove the restore. The runner's own pg_dump is newer than the postgres:15
      # service (a newer dump can hold settings 15 rejects), and apt has no client 15 here, so the
      # tools run from the postgres:15 image on the host network via small wrappers.
      - name: PostgreSQL 15 client tools
        run: |
          mkdir -p "$RUNNER_TEMP/pgbin" "$RUNNER_TEMP/backups"
          for tool in pg_dump pg_dumpall pg_restore psql; do
            cat >"$RUNNER_TEMP/pgbin/$tool" <<EOF
          #!/bin/sh
          exec docker run --rm -i --network host --user "$(id -u):$(id -g)" -v "$RUNNER_TEMP:$RUNNER_TEMP" \\
            -e PGHOST -e PGPORT -e PGUSER -e PGPASSWORD -e PGDATABASE postgres:15 $tool "\$@"
          EOF
            chmod +x "$RUNNER_TEMP/pgbin/$tool"
          done
          echo "$RUNNER_TEMP/pgbin" >> "$GITHUB_PATH"
      - name: Back up the database
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: hydra
          PGDATABASE: hydra
        run: ops/backup/hydra-backup.sh "$RUNNER_TEMP/backups"
      - name: Restore the backup into a scratch database and verify it
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: hydra
          HYDRA_ADMIN: target/debug/hydra-admin
        run: ops/backup/hydra-restore-test.sh --dir "$RUNNER_TEMP/backups"

  # A version bump must go up, and is released when merged (main.yml).
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check a changed workspace version goes up
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          version() { sed -n '/^\[workspace\.package\]/,/^\[/s/^version *= *"\(.*\)"/\1/p'; }
          old="$(git show "$BASE:Cargo.toml" | version)"
          new="$(version < Cargo.toml)"
          if [[ "$old" == "$new" ]]; then
            echo "Version unchanged ($new)."
          elif [[ "$(printf '%s\n%s\n' "$old" "$new" | sort -V | tail -1)" != "$new" ]]; then
            echo "::error::The workspace version goes down, from $old to $new."
            exit 1
          elif git rev-parse -q --verify "refs/tags/v$new" >/dev/null; then
            echo "::error::Tag v$new already exists; pick the next version."
            exit 1
          else
            echo "Version $old -> $new: merging this tags v$new and builds a draft release."
          fi
