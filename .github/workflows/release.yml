name: Release

# Builds signed installers and opens a draft GitHub release for tag vX.Y.Z. main.yml calls it
# when a merged PR bumps the workspace version; pushing a tag by hand starts it too.
# Run it by hand (workflow_dispatch) for an unsigned dry run: the installers are only
# uploaded as workflow artifacts and no secret is used.
on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        description: The tag to release, vX.Y.Z, already pushed
        type: string
        required: true
  workflow_dispatch:

permissions:
  contents: read

# Secrets reach the build jobs only on tag pushes and calls from main.yml, whose event is a
# push to main (`github.event_name == 'push'`), never on hand-started dry runs.
env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: Check the tag matches the workspace version
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          version="$(sed -n '/^\[workspace\.package\]/,/^\[/s/^version *= *"\(.*\)"/\1/p' Cargo.toml)"
          if [[ -z "$version" ]]; then
            echo "::error::No version found in [workspace.package] of Cargo.toml."
            exit 1
          fi
          tag="${INPUT_TAG:-}"
          if [[ -z "$tag" && "$GITHUB_REF_TYPE" == tag ]]; then tag="$GITHUB_REF_NAME"; fi
          if [[ -n "$tag" && "$tag" != "v$version" ]]; then
            echo "::error::Tag $tag does not match the workspace version $version in Cargo.toml. Bump [workspace.package] version or tag v$version."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  windows:
    needs: version
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TARGET: x86_64-pc-windows-msvc
      BIN: target\x86_64-pc-windows-msvc\release
    steps:
      - uses: actions/checkout@v4
      # The toolchain pinned in rust-toolchain.toml.
      - run: rustup toolchain install && rustup target add x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          key: release

      # cargo-wix 0.3.9 (latest release) drives WiX 3 only. The runner image may or may
      # not ship WiX 3, so install the pinned 3.14.1 binaries and point cargo-wix at them.
      - name: Install WiX Toolset 3.14.1
        run: |
          $zip = "$env:RUNNER_TEMP\wix314-binaries.zip"
          Invoke-WebRequest https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip -OutFile $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash
          if ($hash -ne '6ac824e1642d6f7277d0ed7ea09411a508f6116ba6fae0aa5f2c7daa2ff43d31') { throw "WiX download has SHA-256 $hash" }
          Expand-Archive $zip -DestinationPath "$env:RUNNER_TEMP\wix\bin"
          "WIX=$env:RUNNER_TEMP\wix" >> $env:GITHUB_ENV
      - run: cargo install cargo-wix --version 0.3.9 --locked

      # crt-static links the C runtime in, so no Visual C++ Redistributable is needed.
      # An explicit --target keeps the flag off build scripts and proc macros.
      - name: Build
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release --locked -p hydra -p hydra-mcp -p hydra-db --bins --target $env:TARGET

      # Secrets live only in the env of the steps that import or use the certificate, never
      # in the job env, so cargo, build scripts and third-party actions cannot read them.
      - name: Prepare code signing
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ github.event_name == 'push' && secrets.WINDOWS_CERT_PFX_BASE64 || '' }}
        run: |
          if (-not $env:WINDOWS_CERT_PFX_BASE64) {
            Write-Output "::warning::Windows code signing skipped (dry run, or secret WINDOWS_CERT_PFX_BASE64 not set): the MSI and tools are unsigned."
            exit 0
          }
          $pfx = "$env:RUNNER_TEMP\cert.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64))
          $signtool = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\10.*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1).FullName
          if (-not $signtool) { throw "signtool.exe not found" }
          "SIGNTOOL=$signtool" >> $env:GITHUB_ENV
          "PFX=$pfx" >> $env:GITHUB_ENV
      - name: Sign the executables
        if: env.SIGNTOOL != ''
        env:
          WINDOWS_CERT_PASSWORD: ${{ github.event_name == 'push' && secrets.WINDOWS_CERT_PASSWORD || '' }}
        run: |
          & $env:SIGNTOOL sign /f $env:PFX /p $env:WINDOWS_CERT_PASSWORD /fd sha256 /tr http://timestamp.digicert.com /td sha256 /d Hydra "$env:BIN\hydra.exe" "$env:BIN\hydra-mcp.exe" "$env:BIN\hydra-admin.exe"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Build the MSI
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          cargo wix --package hydra --no-build --nocapture --target $env:TARGET --output "dist\Hydra-$env:VERSION-x64.msi"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Sign the MSI
        if: env.SIGNTOOL != ''
        env:
          WINDOWS_CERT_PASSWORD: ${{ github.event_name == 'push' && secrets.WINDOWS_CERT_PASSWORD || '' }}
        run: |
          & $env:SIGNTOOL sign /f $env:PFX /p $env:WINDOWS_CERT_PASSWORD /fd sha256 /tr http://timestamp.digicert.com /td sha256 /d Hydra "dist\Hydra-$env:VERSION-x64.msi"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & $env:SIGNTOOL verify /pa "dist\Hydra-$env:VERSION-x64.msi"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Tools archive
        run: Compress-Archive -Path "$env:BIN\hydra-mcp.exe", "$env:BIN\hydra-admin.exe" -DestinationPath "dist\hydra-tools-$env:VERSION-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*
          if-no-files-found: error
      - name: Remove the certificate
        if: always()
        run: if ($env:PFX) { Remove-Item -Force -ErrorAction SilentlyContinue $env:PFX }

  macos:
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install && rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: release

      # Build first, in a step with no secrets: every build.rs and proc macro runs here.
      - name: Build the universal binaries
        run: packaging/macos/build-dmg.sh --build-only

      # Imports the Developer ID certificate into a throwaway keychain and exports its
      # identity as MACOS_SIGNING_IDENTITY for build-dmg.sh. Only codesign may use the key.
      - name: Import the signing certificate
        env:
          MACOS_CERT_P12_BASE64: ${{ github.event_name == 'push' && secrets.MACOS_CERT_P12_BASE64 || '' }}
          MACOS_CERT_PASSWORD: ${{ github.event_name == 'push' && secrets.MACOS_CERT_PASSWORD || '' }}
        run: |
          if [[ -z "$MACOS_CERT_P12_BASE64" ]]; then
            echo "::warning::macOS signing skipped (dry run, or secret MACOS_CERT_P12_BASE64 not set): the app is ad-hoc signed and not notarized."
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -hex 24)"
          echo -n "$MACOS_CERT_P12_BASE64" | base64 --decode -o "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign -t cert -f pkcs12 -k "$keychain"
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain"
          identity="$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -n 1)"
          if [[ -z "$identity" ]]; then
            echo "::error::MACOS_CERT_P12_BASE64 holds no valid 'Developer ID Application' identity."
            exit 1
          fi
          echo "MACOS_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Sign, package and notarize
        env:
          APPLE_ID: ${{ github.event_name == 'push' && secrets.APPLE_ID || '' }}
          APPLE_TEAM_ID: ${{ github.event_name == 'push' && secrets.APPLE_TEAM_ID || '' }}
          APPLE_APP_PASSWORD: ${{ github.event_name == 'push' && secrets.APPLE_APP_PASSWORD || '' }}
        run: packaging/macos/build-dmg.sh --no-build
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: target/package/dist/*
          if-no-files-found: error
      - name: Remove the keychain
        if: always()
        run: if [[ -n "${KEYCHAIN:-}" ]]; then security delete-keychain "$KEYCHAIN"; fi

  release:
    if: github.event_name == 'push'
    needs: [version, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ needs.version.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # The update check's version endpoint; its URLs point at this release's own assets,
      # which resolve once the draft is published.
      - name: Write latest.json
        run: |
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          jq -n \
            --arg version "$VERSION" \
            --arg windows "$base/Hydra-$VERSION-x64.msi" \
            --arg macos "$base/Hydra-$VERSION-macos-universal.dmg" \
            --arg notes "https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG" \
            '{version: $version, windows: $windows, macos: $macos, notes: $notes}' > dist/latest.json
          cat dist/latest.json
          test -f "dist/Hydra-$VERSION-x64.msi"
          test -f "dist/Hydra-$VERSION-macos-universal.dmg"
      - name: Create the draft release
        run: >-
          gh release create "$TAG" dist/*
          --repo "$GITHUB_REPOSITORY" --verify-tag --draft
          --title "Hydra $VERSION" --generate-notes
