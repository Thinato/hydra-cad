name: Converter

# The STEP-to-glTF converter is separate from the Rust workspace, so it is built only when it
# changes.
on:
  pull_request:
    branches: [main]
    paths:
      - "tools/step2gltf/**"
      - ".github/workflows/converter.yml"

concurrency:
  group: converter-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # The STEP-to-glTF converter needs OpenCASCADE, which Ubuntu packages; Debian's OCCT CMake
  # targets also link TBB and fontconfig, whose -dev packages are not pulled in automatically.
  converter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update
      - run: sudo apt-get install -y --no-install-recommends cmake g++ make libocct-data-exchange-dev libtbb-dev libfontconfig-dev
      - run: cmake -S tools/step2gltf -B "$RUNNER_TEMP/step2gltf"
      - run: cmake --build "$RUNNER_TEMP/step2gltf" -j"$(nproc)"
      - name: Convert the demo fixtures
        run: |
          bin="$RUNNER_TEMP/step2gltf"
          out="$RUNNER_TEMP/models"
          mkdir -p "$out"
          "$bin/make_fixtures" "$out"
          for model in demo-valve-cetop3 demo-block demo-cartridge; do
            "$bin/step2gltf" "$out/$model.step" "$out/$model.glb"
            test -s "$out/$model.glb"
          done
